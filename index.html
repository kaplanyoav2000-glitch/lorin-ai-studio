<style>
  :root{
    --bg: #F4EEE1;
    --cream: #F4EEE1;
    --cream-soft: #ECE3D0;
    --espresso: #2B2018;
    --espresso-soft: #362A1F;
    --ink: #3A2E22;
    --ink-soft: #8C7C63;
    --gold: #C9A876;
    --gold-deep: #A9835A;
    --whatsapp: #2E7D5B;
    --line: #DCCFAF;
    --track: #E2D6BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Hebrew', sans-serif;
    min-height:100vh;
    position:relative;
  }

  .wrap{max-width:760px; margin:0 auto; padding: 48px 20px 90px; position:relative; z-index:1;}

  /* ---------- Top header ---------- */
  .site-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 64px; gap:16px; flex-wrap:wrap; }
  .mark{ display:flex; align-items:center; gap:13px; }
  .mark-icon{
    width:36px; height:36px; flex-shrink:0; border-radius:50%;
    border:1.3px solid var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .mark-icon svg{ width:13px; height:13px; color:var(--gold-deep); }
  .mark-text{ display:flex; flex-direction:column; line-height:1.2; }
  .mark-text b{ font-family:'Frank Ruhl Libre', serif; font-size:16px; font-weight:500; color:var(--ink); text-transform:uppercase; letter-spacing:0.12em; }
  .mark-text span{ font-size:10px; letter-spacing:0.18em; color:var(--gold-deep); font-weight:500; margin-top:3px; }

  .lang-toggle{ display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:0.1em; color:var(--ink-soft); }
  .lang-toggle button{
    background:none; border:none; padding:2px 0; font-size:11px; letter-spacing:0.1em;
    color:var(--ink-soft); cursor:pointer; font-weight:500;
  }
  .lang-toggle button.active{ color:var(--gold-deep); text-decoration:underline; text-underline-offset:3px; }
  .lang-toggle span{ color:var(--line); }

  .icon-flip{ display:inline-flex; }
  [dir="ltr"] .icon-flip{ transform: scaleX(-1); }

  /* ---------- Hero / intro ---------- */
  .hero{ max-width:560px; padding: 20px 0 10px; }

  .hero-eyebrow{
    font-size:11px; letter-spacing:0.2em; color:var(--gold-deep); font-weight:500;
    margin-bottom:18px;
  }
  .hero-copy h1{
    font-family:'David Libre', serif; font-weight:500;
    font-size: clamp(34px, 5.6vw, 52px); line-height:1.25; margin:0 0 24px;
    color:var(--ink); letter-spacing:0.01em;
  }
  .hero-copy p{
    font-family:'David Libre', serif; font-weight:400;
    font-size:18px; color:var(--ink-soft); line-height:1.85;
    max-width:42ch; margin: 0 0 32px;
  }
  .hero-meta-list{ display:flex; flex-direction:column; gap:11px; margin-bottom:38px; }
  .hero-meta-list span{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .hero-meta-list svg{ width:14px; height:14px; color:var(--gold-deep); flex-shrink:0; }

  /* ---------- Our Story section ---------- */
  .story{
    margin-top:70px; padding-top:56px; border-top:1px solid var(--line);
    max-width:560px;
  }
  .story-eyebrow{
    font-size:11px; letter-spacing:0.2em; color:var(--gold-deep); font-weight:500;
    margin-bottom:14px;
  }
  .story h2{
    font-family:'Frank Ruhl Libre', serif; font-weight:500; text-transform:uppercase;
    letter-spacing:0.06em; font-size: clamp(24px, 3.6vw, 30px); margin:0 0 22px; color:var(--ink);
  }
  .story p{
    font-size:15.5px; color:var(--ink-soft); line-height:1.9; margin:0 0 18px; max-width:56ch;
  }
  .testimonial-list{ display:flex; flex-direction:column; margin-top:8px; max-width:600px; }
  .testimonial-quote{ padding:22px 0; border-bottom:1px solid var(--line); }
  .testimonial-quote:last-child{ border-bottom:none; }
  .testimonial-quote p{
    font-family:'David Libre', serif; font-style:italic; font-size:16.5px;
    color:var(--ink); line-height:1.75; margin:0 0 10px;
  }
  .testimonial-quote .cap{ font-size:12.5px; color:var(--ink-soft); letter-spacing:0.02em; }

  .video-grid{
    display:flex; gap:20px; margin-top:10px; overflow-x:auto; padding-bottom:6px;
    scroll-snap-type: x proximity;
  }
  .video-item{
    position:relative; flex:0 0 300px; width:300px; aspect-ratio:9/16;
    overflow:hidden; border:1px solid var(--line); background:var(--espresso) center/cover no-repeat;
    cursor:pointer; scroll-snap-align:start;
  }
  .video-item::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.4), rgba(0,0,0,0) 45%);
  }
  .video-item.loaded{ cursor:default; }
  .video-item.loaded::after{ display:none; }
  .video-play{
    position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center;
  }
  .video-play svg{
    width:20px; height:20px; color:#fff;
  }
  .video-play::before{
    content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:60px; height:60px; border-radius:50%;
    border:1.3px solid rgba(255,255,255,0.85);
  }
  .video-item iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }
  @media (max-width:640px){ .video-item{ flex-basis:230px; width:230px; } }

  .footer-brand{

  button{

    letter-spacing:0.03em;
    background:transparent; cursor:pointer; padding: 14px 30px;
    transition: background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease;

  button:active{ transform: scale(0.98); }

  .btn-start{
    border:1.2px solid var(--gold-deep); color:var(--gold-deep); font-size:14.5px;
    padding: 16px 38px; display:inline-flex; align-items:center; gap:10px;

  .btn-start:hover{ background:var(--gold-deep); color:var(--cream); }
  .btn-start svg{ width:15px; height:15px; }

  .btn-primary:hover{ background:var(--ink); color:var(--cream); }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary:disabled:hover{ background:transparent; color:var(--ink); }

  .btn-ghost{ border:none; color:var(--ink-soft); padding:14px 6px; }
  .btn-ghost:hover{ color:var(--ink); }

  /* ---------- Scrubber progress ---------- */
  .scrubber{ margin: 0 0 30px; }
  .scrubber-track{
    position:relative; height:1px; background:var(--track);
  }
  .scrubber-fill{
    position:absolute; top:0; bottom:0; inset-inline-start:0; width:0%;
    background:var(--gold-deep);
    transition: width .5s cubic-bezier(.65,0,.35,1);
  }
  .scrubber-head{
    position:absolute; top:50%; width:8px; height:8px; border-radius:50%;
    background:var(--gold-deep); transform:translate(50%,-50%);
    transition: inset-inline-start .5s cubic-bezier(.65,0,.35,1);

  .scrubber-labels{
    display:flex; justify-content:space-between; margin-top:12px;
    font-size:11px; color:var(--ink-soft); letter-spacing:0.06em;
  }

  .screen-shell{

  .anim-in{ animation: screenIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes screenIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .q-head{ display:flex; align-items:flex-start; gap:16px; margin-bottom: 10px; }
  .q-icon{
    width:36px; height:36px; flex-shrink:0; border-radius:50%;

    color:var(--gold-deep);
  }
  .q-icon svg{ width:17px; height:17px; }
  .q-eyebrow{ font-size:11px; color:var(--gold-deep); margin-bottom:4px; letter-spacing:0.18em; }
  .q-head h2{
    font-family:'Frank Ruhl Libre', serif; font-weight:500;
    font-size: clamp(22px, 3.2vw, 27px); margin:0; line-height:1.35; color:var(--ink);
  }
  .q-hint{ color:var(--ink-soft); font-size:14px; margin: 12px 0 26px; line-height:1.7; }

  .options{ display:flex; flex-direction:column; margin-bottom: 6px; }
  .opt{
    display:flex; align-items:center; gap:16px;
    border:none; border-bottom:1px solid var(--line); background:transparent;
    padding: 18px 2px; cursor:pointer; font-size:15.5px; color:var(--ink);
    transition: border-color .15s ease, color .15s ease;

  .opt:hover{ color:var(--gold-deep); }
  .opt:active{ opacity:.85; }
  .opt input{ display:none; }
  .opt .mark-shape{
    width:17px; height:17px; border-radius:50%; border:1.2px solid var(--ink-soft);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; order:2;
  }
  .opt.checkbox .mark-shape{ border-radius:4px; }
  .opt .mark-shape svg{ width:9px; height:9px; opacity:0; transform:scale(0.4); transition: all .18s cubic-bezier(.2,.8,.2,1); color:#fff; }
  .opt input:checked ~ .mark-shape{ background:var(--gold-deep); border-color:var(--gold-deep); }
  .opt input:checked ~ .mark-shape svg{ opacity:1; transform:scale(1); }
  .opt:has(input:checked){ border-color:var(--gold-deep); }
  .opt:has(input:checked) .label-block{ font-weight:600; color:var(--ink); }
  .opt .label-block{ flex:1; }

  .idea-textarea{
    width:100%; min-height:150px; resize:vertical;
    font-family:'IBM Plex Sans Hebrew', sans-serif; font-size:15px; color:var(--ink);
    background:transparent; border:1.2px solid var(--line); padding:16px;
    line-height:1.7;
  }
  .idea-textarea:focus{ outline:none; border-color:var(--gold-deep); }
  .idea-textarea::placeholder{ color:#B4A788; }

  /* ---------- Recap + WhatsApp ---------- */
  .recap-rows{ margin: 4px 0 26px; }
  .r-row{
    display:flex; justify-content:space-between; gap:16px; padding:14px 0;
    border-bottom:1px solid var(--line); font-size:14px;
  }
  .r-row:last-child{ border-bottom:none; }
  .r-row span:first-child{ color:var(--ink-soft); }
  .r-row span:last-child{ font-weight:600; text-align:end; }

  .recap-idea{ margin: 4px 0 26px; padding-top:6px; }
  .recap-idea-label{ font-size:11px; letter-spacing:0.12em; color:var(--gold-deep); margin-bottom:8px; }
  .recap-idea p{ font-size:14.5px; color:var(--ink); line-height:1.8; white-space:pre-wrap; }

  .wa-btn{
    display:flex; align-items:center; gap:11px; justify-content:center;
    border:1.2px solid var(--whatsapp); color:var(--whatsapp); text-decoration:none;
    padding:16px 30px; font-weight:500; font-size:15px; width:100%; letter-spacing:0.03em;
    transition: background .15s ease, color .15s ease;
  }
  .wa-btn:hover{ background:var(--whatsapp); color:#fff; }
  .wa-btn:active{ opacity:.85; }
  .wa-btn svg{ width:19px; height:19px; flex-shrink:0; }
</style>
</head>

let current = 0;
const answers = {};
const qSteps = steps.filter(s => s.type === "radio" || s.type === "checkbox" || s.type === "textarea");

function renderScrubber(){
  if(current === 0) return "";
  const qIndex = qSteps.findIndex(s => s.key === steps[current].key);
  const total = qSteps.length;
  const isLast = steps[current].type === "summary";
  const pos = isLast ? total : (qIndex + 1);
  const pct = (pos / total) * 100;
  return `
    <div class="scrubber">
      <div class="scrubber-track">
        <div class="scrubber-fill" style="width:${pct}%"></div>
        <div class="scrubber-head" style="inset-inline-start:${pct}%"></div>
      </div>
      <div class="scrubber-labels">
        <span>${isLast ? L(UI.summaryStep) : L(UI.questionOf)(pos,total)}</span>
        <span>${Math.round(pct)}%</span>
      </div>
    </div>`;
}

function goTo(idx){
  current = Math.max(0, Math.min(steps.length-1, idx));
  render();
  window.scrollTo({top:0, behavior:'smooth'});

  const step = steps[current];
  if(step.type === "summary"){
    trackEvent("questionnaire_reached_summary");
  } else if(step.type !== "intro"){
    const qIndex = qSteps.findIndex(s => s.key === step.key);
    trackEvent("question_step_viewed", { step_key: step.key, step_number: qIndex + 1 });
  }
}

function optionCard(name, value, label, checked, isCheckbox){
  return `
    <label class="opt ${isCheckbox?'checkbox':''}">
      <input type="${isCheckbox?'checkbox':'radio'}" name="${name}" value="${value}" ${checked?'checked':''}>
      <span class="label-block">${label}</span>
      <span class="mark-shape">${ICONS.check}</span>
    </label>`;
}

function buildWhatsAppMessage(){
  const lines = [L(UI.waIntro), ""];
  qSteps.forEach(step=>{
    const val = answers[step.key];
    if(!val) return;
    const title = L(step.title);
    if(step.type === "checkbox"){
      const labels = val.map(v=>L(step.source[v].label)).join(", ");
      lines.push(`*${title}*\n${labels}`, "");
    } else if(step.type === "textarea"){
      lines.push(`*${title}*\n${val}`, "");
    } else {
      lines.push(`*${title}*\n${L(step.source[val].label)}`, "");
    }
  });
  return lines.join("\n");
}

function checkCanProceed(step){
  if(step.type === "radio") return !!answers[step.key];
  if(step.type === "checkbox") return (answers[step.key]||[]).length > 0;
  return true;
}

    `;
    bodyHtml = `
      <div class="recap-rows">
        ${qSteps.filter(s=>s.type!=="textarea" && answers[s.key]).map(s=>{
          const val = answers[s.key];
          const text = s.type==="checkbox" ? val.map(v=>L(s.source[v].label)).join("، ") : L(s.source[val].label);
          return `<div class="r-row"><span>${L(s.title)}</span><span>${text}</span></div>`;
        }).join("")}
      </div>
      ${answers.ideaDescription ? `
        <div class="recap-idea">
          <div class="recap-idea-label">${L(UI.ideaLabel)}</div>
          <p>${answers.ideaDescription.replace(/</g,"&lt;")}</p>
        </div>
      ` : ``}
      <a class="wa-btn" href="${waLink}" target="_blank" rel="noopener" id="wa-send-btn">
        ${ICONS.whatsapp} ${L(UI.sendWhatsapp)}
      </a>
    `;
  }

  const isLast = step.type === "summary";
  const canProceed = checkCanProceed(step);

  app.innerHTML = `
    ${renderScrubber()}
    <div class="screen-shell">
      <div class="screen-inner anim-in" id="screen-inner">
        ${headHtml}
        ${bodyHtml}
        <div class="nav-row">
          <button class="btn-ghost" id="btn-back"><span class="icon-flip">${ICONS.arrowLeft}</span> ${L(UI.backBtn)}</button>
          ${!isLast ? `<button class="btn-primary" id="btn-next" ${canProceed?'':'disabled'}>${L(UI.nextBtn)}</button>` : `<span></span>`}
        </div>
      </div>
    </div>
  `;

  attachHandlers(step);
}

function attachHandlers(step){
  const scope = document.getElementById("screen-inner");
  if(!scope) return;

  scope.querySelectorAll('input[type=radio]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ answers[step.key] = inp.value; render(); });
  });
  scope.querySelectorAll('input[type=checkbox]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const set = new Set(answers[step.key]||[]);
      if(inp.checked) set.add(inp.value); else set.delete(inp.value);
      answers[step.key] = Array.from(set);
      render();
    });
  });
  const textarea = document.getElementById('idea-textarea');
  if(textarea){
    textarea.addEventListener('input', ()=>{ answers[step.key] = textarea.value; });
  }
  const back = document.getElementById('btn-back');
  if(back) back.addEventListener('click', ()=> goTo(current-1));
  const next = document.getElementById('btn-next');
  if(next) next.addEventListener('click', ()=> goTo(current+1));
  const waBtn = document.getElementById('wa-send-btn');
  if(waBtn) waBtn.addEventListener('click', ()=> trackEvent("whatsapp_click"));
}

render();

/* ====================== FOOTER (also language-aware) ====================== */
function renderFooter(){
  document.getElementById("footer-mail-circle").href = `mailto:${SOCIAL.email}`;
  document.getElementById("footer-tagline").textContent = L(UI.footerTagline);
  document.getElementById("footer-desc").textContent = L(UI.footerDesc);
  document.getElementById("footer-connect-label").textContent = L(UI.footerConnect);
  document.getElementById("footer-connect").innerHTML = `
    <a href="${SOCIAL.instagramUrl}" target="_blank" rel="noopener">Instagram · @${SOCIAL.instagramHandle}</a>
    <a href="mailto:${SOCIAL.email}">${SOCIAL.email}</a>
  `;
}
renderFooter();

/* ====================== LANGUAGE TOGGLE ====================== */
function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang === "en" ? "en" : "he";
  document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
  document.querySelectorAll('#lang-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  render();
  renderFooter();
  try{ localStorage.setItem('lorin-lang', lang); }catch(e){ /* ignore if unavailable */ }
}

document.querySelectorAll('#lang-toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=> applyLanguage(btn.dataset.lang));
});

/* Restore a previously chosen language, if any */
try{
  const saved = localStorage.getItem('lorin-lang');
  if(saved === 'en') applyLanguage('en');
}catch(e){ /* ignore if unavailable */ }
</script>
