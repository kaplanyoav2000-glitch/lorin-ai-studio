<style>
  :root{
    --bg: #F4EEE1;
    --cream: #F4EEE1;
    --cream-soft: #ECE3D0;
    --espresso: #2B2018;
    --espresso-soft: #362A1F;
    --ink: #3A2E22;
    --ink-soft: #8C7C63;
    --gold: #C9A876;
    --gold-deep: #A9835A;
    --whatsapp: #2E7D5B;
    --line: #DCCFAF;
    --track: #E2D6BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Hebrew', sans-serif;
    min-height:100vh;
    position:relative;
  }

  .wrap{max-width:760px; margin:0 auto; padding: 48px 20px 90px; position:relative; z-index:1;}

  /* ---------- Top mark ---------- */
  .mark{ display:flex; align-items:center; gap:13px; margin-bottom: 64px; }
  .mark-icon{
    width:36px; height:36px; flex-shrink:0; border-radius:50%;
    border:1.3px solid var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .mark-icon svg{ width:13px; height:13px; color:var(--gold-deep); }
  .mark-text{ display:flex; flex-direction:column; line-height:1.2; }
  .mark-text b{ font-family:'Frank Ruhl Libre', serif; font-size:16px; font-weight:500; color:var(--ink); text-transform:uppercase; letter-spacing:0.12em; }
  .mark-text span{ font-size:10px; letter-spacing:0.18em; color:var(--gold-deep); font-weight:500; margin-top:3px; }

  /* ---------- Hero / intro ---------- */
  .hero{ max-width:560px; padding: 20px 0 10px; }

  .hero-eyebrow{
    font-size:11px; letter-spacing:0.2em; color:var(--gold-deep); font-weight:500;
    margin-bottom:18px;
  }
  .hero-copy h1{
    font-family:'David Libre', serif; font-weight:500;
    font-size: clamp(34px, 5.6vw, 52px); line-height:1.25; margin:0 0 24px;
    color:var(--ink); letter-spacing:0.01em;
  }
  .hero-copy p{
    font-family:'David Libre', serif; font-weight:400;
    font-size:18px; color:var(--ink-soft); line-height:1.85;
    max-width:42ch; margin: 0 0 32px;
  }
  .hero-meta-list{ display:flex; flex-direction:column; gap:11px; margin-bottom:38px; }
  .hero-meta-list span{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .hero-meta-list svg{ width:14px; height:14px; color:var(--gold-deep); flex-shrink:0; }

  /* ---------- Our Story section ---------- */
  .story{
    margin-top:70px; padding-top:56px; border-top:1px solid var(--line);
    max-width:560px;
  }
  .story-eyebrow{
    font-size:11px; letter-spacing:0.2em; color:var(--gold-deep); font-weight:500;
    margin-bottom:14px;
  }
  .story h2{
    font-family:'Frank Ruhl Libre', serif; font-weight:500; text-transform:uppercase;
    letter-spacing:0.06em; font-size: clamp(24px, 3.6vw, 30px); margin:0 0 22px; color:var(--ink);
  }
  .story p{
    font-size:15.5px; color:var(--ink-soft); line-height:1.9; margin:0 0 18px; max-width:56ch;
  }

  /* ---------- Site footer ---------- */
  .site-footer{
    background:var(--espresso); color:#E7DCC6; margin-top:80px;
  }
  .site-footer-inner{ max-width:760px; margin:0 auto; padding: 56px 20px 44px; }
  .footer-brand{
    font-family:'Frank Ruhl Libre', serif; font-weight:500; text-transform:uppercase;
    letter-spacing:0.16em; font-size:22px; color:var(--gold); margin-bottom:8px;
  }
  .footer-tagline{ font-size:11px; letter-spacing:0.18em; color:#9C8E76; margin-bottom:20px; }
  .footer-desc{ font-size:14.5px; color:#C7B99C; line-height:1.8; max-width:44ch; margin-bottom:28px; }

  .footer-contacts{ display:flex; gap:12px; margin-bottom:40px; }
  .footer-contact-circle{
    width:42px; height:42px; border-radius:50%; border:1.2px solid rgba(231,220,198,0.35);
    display:flex; align-items:center; justify-content:center; color:#E7DCC6;
    text-decoration:none; transition: border-color .15s ease, color .15s ease;
  }
  .footer-contact-circle:hover{ border-color:var(--gold); color:var(--gold); }
  .footer-contact-circle svg{ width:17px; height:17px; }

  .footer-connect-label{
    font-size:11px; letter-spacing:0.18em; color:var(--gold-deep); margin-bottom:14px;
  }
  .footer-connect a, .footer-connect span{
    display:block; font-size:14.5px; color:#E7DCC6; text-decoration:none; margin-bottom:8px;
  }
  .footer-connect a:hover{ color:var(--gold); }

  /* ---------- Buttons — all outline / ghost style ---------- */
  .nav-row{
    margin-top:auto; display:flex; justify-content:space-between; align-items:center;
    padding-top: 32px;
  }
  button{
    font-family:'IBM Plex Sans Hebrew', sans-serif; font-size:14.5px; font-weight:500;
    letter-spacing:0.03em;
    background:transparent; cursor:pointer; padding: 14px 30px;
    transition: background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease;
  }
  button:active{ transform: scale(0.98); }

  .btn-start{
    border:1.2px solid var(--gold-deep); color:var(--gold-deep); font-size:14.5px;
    padding: 16px 38px; display:inline-flex; align-items:center; gap:10px;
  }
  .btn-start:hover{ background:var(--gold-deep); color:var(--cream); }
  .btn-start svg{ width:15px; height:15px; }

  .btn-primary{ border:1.2px solid var(--ink); color:var(--ink); display:inline-flex; align-items:center; gap:8px; }
  .btn-primary:hover{ background:var(--ink); color:var(--cream); }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary:disabled:hover{ background:transparent; color:var(--ink); }

  .btn-ghost{ border:none; color:var(--ink-soft); padding:14px 6px; }
  .btn-ghost:hover{ color:var(--ink); }

  /* ---------- Scrubber progress ---------- */
  .scrubber{ margin: 0 0 30px; }
  .scrubber-track{
    position:relative; height:1px; background:var(--track);
  }
  .scrubber-fill{
    position:absolute; top:0; bottom:0; right:0; width:0%;
    background:var(--gold-deep);
    transition: width .5s cubic-bezier(.65,0,.35,1);
  }
  .scrubber-head{
    position:absolute; top:50%; width:8px; height:8px; border-radius:50%;
    background:var(--gold-deep); transform:translate(50%,-50%);
    transition: right .5s cubic-bezier(.65,0,.35,1);
  }
  .scrubber-labels{
    display:flex; justify-content:space-between; margin-top:12px;
    font-size:11px; color:var(--ink-soft); letter-spacing:0.06em;
  }

  /* ---------- Screen (the question panel) ---------- */
  .screen-shell{
    position:relative;
    border-top:1px solid var(--line);
    background:transparent;
    color:var(--ink);
  }
  .screen-inner{
    padding: 40px 4px;
    min-height: 380px;
    display:flex; flex-direction:column;
  }
  @media (max-width:560px){ .screen-inner{ padding: 32px 2px; } }

  .anim-in{ animation: screenIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes screenIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .q-head{ display:flex; align-items:flex-start; gap:16px; margin-bottom: 10px; }
  .q-icon{
    width:36px; height:36px; flex-shrink:0; border-radius:50%;
    border:1.2px solid var(--gold-deep); display:flex; align-items:center; justify-content:center;
    color:var(--gold-deep);
  }
  .q-icon svg{ width:17px; height:17px; }
  .q-eyebrow{ font-size:11px; color:var(--gold-deep); margin-bottom:4px; letter-spacing:0.18em; }
  .q-head h2{
    font-family:'Frank Ruhl Libre', serif; font-weight:500;
    font-size: clamp(22px, 3.2vw, 27px); margin:0; line-height:1.35; color:var(--ink);
  }
  .q-hint{ color:var(--ink-soft); font-size:14px; margin: 12px 0 26px; line-height:1.7; }

  .options{ display:flex; flex-direction:column; margin-bottom: 6px; }
  .opt{
    display:flex; align-items:center; gap:16px;
    border:none; border-bottom:1px solid var(--line); background:transparent;
    padding: 18px 2px; cursor:pointer; font-size:15.5px; color:var(--ink);
    transition: border-color .15s ease, color .15s ease;
  }
  .opt:hover{ color:var(--gold-deep); }
  .opt:active{ opacity:.85; }
  .opt input{ display:none; }
  .opt .mark-shape{
    width:17px; height:17px; border-radius:50%; border:1.2px solid var(--ink-soft);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; order:2;
  }
  .opt.checkbox .mark-shape{ border-radius:4px; }
  .opt .mark-shape svg{ width:9px; height:9px; opacity:0; transform:scale(0.4); transition: all .18s cubic-bezier(.2,.8,.2,1); color:#fff; }
  .opt input:checked ~ .mark-shape{ background:var(--gold-deep); border-color:var(--gold-deep); }
  .opt input:checked ~ .mark-shape svg{ opacity:1; transform:scale(1); }
  .opt:has(input:checked){ border-color:var(--gold-deep); }
  .opt:has(input:checked) .label-block{ font-weight:600; color:var(--ink); }
  .opt .label-block{ flex:1; }

  .idea-textarea{
    width:100%; min-height:150px; resize:vertical;
    font-family:'IBM Plex Sans Hebrew', sans-serif; font-size:15px; color:var(--ink);
    background:transparent; border:1.2px solid var(--line); padding:16px;
    line-height:1.7;

  .idea-textarea:focus{ outline:none; border-color:var(--gold-deep); }
  .idea-textarea::placeholder{ color:#B4A788; }

  .recap-rows{ margin: 4px 0 26px; }
  .r-row{
    display:flex; justify-content:space-between; gap:16px; padding:14px 0;
    border-bottom:1px solid var(--line); font-size:14px;
  }
  .r-row:last-child{ border-bottom:none; }
  .r-row span:first-child{ color:var(--ink-soft); }
  .r-row span:last-child{ font-weight:600; text-align:left; }

  .recap-idea{ margin: 4px 0 26px; padding-top:6px; }
  .recap-idea-label{ font-size:11px; letter-spacing:0.12em; color:var(--gold-deep); margin-bottom:8px; }
  .recap-idea p{ font-size:14.5px; color:var(--ink); line-height:1.8; white-space:pre-wrap; }

  .wa-btn{
    display:flex; align-items:center; gap:11px; justify-content:center;
    border:1.2px solid var(--whatsapp); color:var(--whatsapp); text-decoration:none;
    padding:16px 30px; font-weight:500; font-size:15px; width:100%; letter-spacing:0.03em;
    transition: background .15s ease, color .15s ease;
  }
  .wa-btn:hover{ background:var(--whatsapp); color:#fff; }
  .wa-btn:active{ opacity:.85; }
  .wa-btn svg{ width:19px; height:19px; flex-shrink:0; }

    "internal": { label: "הדרכה / תוכן פנימי" },
    "event":    { label: "אירוע מיוחד" },
  },
  language: {
    "hebrew":  { label: "עברית" },
    "english": { label: "אנגלית" },
    "other":   { label: "שפה אחרת" },
  },
  subtitles: {
    "no":  { label: "לא" },
    "yes": { label: "כן" },
  },
  formats: {
    "16:9": { label: "16:9 — יוטיוב / אתר" },
    "9:16": { label: "9:16 — סטוריז / רילס / שורטס" },
    "1:1":  { label: "1:1 — פיד" },
  },
};

const steps = [
  { key:"intro", type:"intro" },
  { key:"package",    type:"radio",    icon:"stack",    eyebrow:"היקף",         title:"חבילת סרטונים או סרטון בודד?", hint:"", source:OPTIONS.package },
  { key:"length",     type:"radio",    icon:"clock",    eyebrow:"אורך",        title:"כמה זמן יאורך הסרטון?", hint:"", source:OPTIONS.length },
  { key:"style",      type:"radio",    icon:"aperture", eyebrow:"נראות",       title:"ריאליסטי, או נראות שמזוהה כ-AI?", hint:"", source:OPTIONS.style },
  { key:"concept",    type:"radio",    icon:"bulb",     eyebrow:"קריאטיב",     title:"יש לך כבר רעיון קריאטיבי?", hint:"", source:OPTIONS.concept },
  { key:"purpose",    type:"radio",    icon:"target",   eyebrow:"מטרה",        title:"למה הסרטון ישמש?", hint:"", source:OPTIONS.purpose },
  { key:"language",   type:"radio",    icon:"globe",    eyebrow:"שפה",         title:"באיזו שפה הסרטון?", hint:"", source:OPTIONS.language },
  { key:"subtitles",  type:"radio",    icon:"caption",  eyebrow:"כתוביות",     title:"נדרשות כתוביות?", hint:"", source:OPTIONS.subtitles },
  { key:"formats",    type:"checkbox", icon:"frame",    eyebrow:"פורמט",       title:"אילו פורמטים / יחסי גובה-רוחב נדרשים?", hint:"אפשר לבחור כמה", source:OPTIONS.formats },
  { key:"ideaDescription", type:"textarea", icon:"message", eyebrow:"הרעיון שלכם", title:"ספרו לי בפירוט על הרעיון לסרטון", hint:"כל פרט עוזר — הסיפור שרוצים לספר, המסר המרכזי, הטון (רציני / קליל / מצחיק), השראה מסרטונים שאהבתם, או כל דבר אחר שיעזור לי להבין את החזון שלכם. אם עדיין אין רעיון גיבוש — כתבו מה שכן ברור, גם אם זו רק תחושה כללית." },
  { key:"summary",    type:"summary" },
];

let current = 0;
const answers = {};
const qSteps = steps.filter(s => s.type === "radio" || s.type === "checkbox" || s.type === "textarea");

function renderScrubber(){
  if(current === 0) return "";
  const qIndex = qSteps.findIndex(s => s.key === steps[current].key);
  const total = qSteps.length;
  const isLast = steps[current].type === "summary";
  const pos = isLast ? total : (qIndex + 1);
  const pct = (pos / total) * 100;
  return `
    <div class="scrubber">
      <div class="scrubber-track">
        <div class="scrubber-fill" style="width:${pct}%"></div>
        <div class="scrubber-head" style="right:${pct}%"></div>
      </div>
      <div class="scrubber-labels">
        <span>${isLast ? "סיכום" : `שאלה ${pos} מתוך ${total}`}</span>
        <span>${Math.round(pct)}%</span>
      </div>
    </div>`;
}

function goTo(idx){
  current = Math.max(0, Math.min(steps.length-1, idx));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function optionCard(name, value, label, checked, isCheckbox){
  return `
    <label class="opt ${isCheckbox?'checkbox':''}">
      <input type="${isCheckbox?'checkbox':'radio'}" name="${name}" value="${value}" ${checked?'checked':''}>
      <span class="label-block">${label}</span>
      <span class="mark-shape">${ICONS.check}</span>
    </label>`;
}

function buildWhatsAppMessage(){
  const lines = ["היי, מילאתי את שאלון ההיכרות באתר ואשמח להצעת מחיר 🎬", ""];
  qSteps.forEach(step=>{
    const val = answers[step.key];
    if(!val) return;
    if(step.type === "checkbox"){
      const labels = val.map(v=>step.source[v].label).join(", ");
      lines.push(`*${step.title}*\n${labels}`, "");
    } else if(step.type === "textarea"){
      lines.push(`*${step.title}*\n${val}`, "");
    } else {
      lines.push(`*${step.title}*\n${step.source[val].label}`, "");
    }
  });
  return lines.join("\n");
}

function checkCanProceed(step){
  if(step.type === "radio") return !!answers[step.key];
  if(step.type === "checkbox") return (answers[step.key]||[]).length > 0;
  return true;
}

function render(){
  const app = document.getElementById("app");
  const step = steps[current];

  if(step.type === "intro"){
    app.innerHTML = `
      <div class="hero">
        <div class="hero-copy">
          <div class="hero-eyebrow">LORIN AI STUDIO</div>
          <h1>ספרו לי על<br>הסרטון שלכם</h1>
          <p>איזה כיף שהחלטתם לקחת את העסק שלכם צעד אחד קדימה! כמה שאלות קצרות יעזרו לי להבין בדיוק מה אתם צריכים ונוכל לדייק את העבודה ביחד.</p>
          <div class="hero-meta-list">
            <span>${ICONS.clock}${qSteps.length} שאלות קצרות</span>
            <span>${ICONS.clock}כדקה-שתיים למילוי השאלון</span>
          </div>
          <button class="btn-start" id="btn-start">בואו נתחיל ${ICONS.arrowLeft}</button>
        </div>
      </div>

      <div class="story">
        <div class="story-eyebrow">הסיפור שלנו</div>
        <h2>סרטון AI מקצועי</h2>
        <p>Lorin AI Studio נולדה מתוך אמונה שכל עסק, גדול כקטן, ראוי לסרטון שיווקי מקצועי — בלי צוות צילום, בלי תקציב ענק, ובלי חודשים של המתנה.</p>
        <p>בעזרת טכנולוגיית AI מתקדמת אני הופכת רעיון פשוט לסרטון שנראה מקצועי, מדויק למותג שלכם, ומוכן תוך ימים ספורים.</p>
      </div>
    `;
    document.getElementById("btn-start").addEventListener("click", ()=> goTo(1));
    return;
  }

  let bodyHtml = "";
  let headHtml = "";

  if(step.type === "radio" || step.type === "checkbox" || step.type === "textarea"){
    headHtml = `
      <div class="q-head">
        <span class="q-icon">${ICONS[step.icon]}</span>
        <div>
          <div class="q-eyebrow">${step.eyebrow}</div>
          <h2>${step.title}</h2>
        </div>
      </div>
      ${step.hint ? `<p class="q-hint">${step.hint}</p>` : `<div style="margin-bottom:22px"></div>`}
    `;
    if(step.type === "radio"){
      bodyHtml = `<div class="options">` + Object.entries(step.source).map(([key,val])=>
        optionCard(step.key, key, val.label, answers[step.key]===key, false)
      ).join("") + `</div>`;
    } else if(step.type === "checkbox"){
      const selected = answers[step.key] || [];
      bodyHtml = `<div class="options">` + Object.entries(step.source).map(([key,val])=>
        optionCard(step.key, key, val.label, selected.includes(key), true)
      ).join("") + `</div>`;
    } else if(step.type === "textarea"){
      const existing = answers[step.key] || "";
      bodyHtml = `<textarea id="idea-textarea" class="idea-textarea" rows="7" placeholder="לדוגמה: אני רוצה סרטון שמראה איך המוצר שלנו פותר בעיה יומיומית, בטון קליל וחברותי, עם דגש על הרגע שבו הלקוח 'מתחבר' לפתרון...">${existing}</textarea>`;
    }
  } else if(step.type === "summary"){
    const message = buildWhatsAppMessage();
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    headHtml = `
      <div class="q-head">
        <span class="q-icon">${ICONS.check}</span>
        <div>
          <div class="q-eyebrow">שלב אחרון</div>
          <h2>סיכום התשובות שלך</h2>
        </div>
      </div>
      <div style="margin-bottom:22px"></div>
    `;
    bodyHtml = `
      <div class="recap-rows">
        ${qSteps.filter(s=>s.type!=="textarea" && answers[s.key]).map(s=>{
          const val = answers[s.key];
          const text = s.type==="checkbox" ? val.map(v=>s.source[v].label).join("، ") : s.source[val].label;
          return `<div class="r-row"><span>${s.title}</span><span>${text}</span></div>`;
        }).join("")}
      </div>
      ${answers.ideaDescription ? `
        <div class="recap-idea">
          <div class="recap-idea-label">הרעיון שלכם</div>
          <p>${answers.ideaDescription.replace(/</g,"&lt;")}</p>
        </div>
      ` : ``}
      <a class="wa-btn" href="${waLink}" target="_blank" rel="noopener">
        ${ICONS.whatsapp} שליחה בוואטסאפ
      </a>
    `;
  }

  const isLast = step.type === "summary";
  const canProceed = checkCanProceed(step);

  app.innerHTML = `
    ${renderScrubber()}
    <div class="screen-shell">
      <div class="screen-inner anim-in" id="screen-inner">
        ${headHtml}
        ${bodyHtml}
        <div class="nav-row">
          <button class="btn-ghost" id="btn-back">${ICONS.arrowLeft} הקודם</button>
          ${!isLast ? `<button class="btn-primary" id="btn-next" ${canProceed?'':'disabled'}>הבא</button>` : `<span></span>`}
        </div>
      </div>
    </div>
  `;

  attachHandlers(step);
}

function attachHandlers(step){
  const scope = document.getElementById("screen-inner");
  if(!scope) return;

  scope.querySelectorAll('input[type=radio]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ answers[step.key] = inp.value; render(); });
  });
  scope.querySelectorAll('input[type=checkbox]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const set = new Set(answers[step.key]||[]);
      if(inp.checked) set.add(inp.value); else set.delete(inp.value);
      answers[step.key] = Array.from(set);
      render();
    });
  });
  const textarea = document.getElementById('idea-textarea');
  if(textarea){
    textarea.addEventListener('input', ()=>{ answers[step.key] = textarea.value; });
  }
  const back = document.getElementById('btn-back');
  if(back) back.addEventListener('click', ()=> goTo(current-1));
  const next = document.getElementById('btn-next');
  if(next) next.addEventListener('click', ()=> goTo(current+1));
}

render();

/* Sync footer contact details from the SOCIAL config above */
document.getElementById("footer-mail-circle").href = `mailto:${SOCIAL.email}`;
document.getElementById("footer-connect").innerHTML = `
  <a href="${SOCIAL.instagramUrl}" target="_blank" rel="noopener">Instagram · @${SOCIAL.instagramHandle}</a>
  <a href="mailto:${SOCIAL.email}">${SOCIAL.email}</a>
`;
</script>
</body>
</html>
